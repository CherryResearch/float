[tool.poetry]
name = "float-project"
version = "0.1.0a1"
description = "A latent-thought based learning agent"
authors = ["Cherry Research <cherry.research@pm.me>"]
license = "AGPL-3.0-only"
packages = [
    { include = "app", from = "backend" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.1"
uvicorn = "^0.34.3"
pydantic = "^2.11.7"
sqlalchemy = { version = "^2.0.41", optional = true }
psycopg2-binary = { version = "^2.9.10", optional = true }
cryptography = "^45.0.4"
celery = "^5.5.3"
redis = "^6.2.0"
python-dotenv = "^1.1.0"
httpx = "^0.28.1"
requests = "^2.32.4"
pandas = "^2.3.0"
networkx = "^3.1"
bcrypt = { version = "^4.3.0", optional = true }
pyjwt = "^2.10.1"
pyopenssl = { version = "^25.1.0", optional = true }
weaviate-client = { version = "^4.9.2", optional = true }
alembic = { version = "^1.16.2", optional = true }
beautifulsoup4 = "^4.13.4"
watchdog = "^6.0.0"
python-docx = "^1.2.0"
PyPDF2 = "^3.0.1"
sentence-transformers = "^5.0.0"
kokoro = { version = "^0.9.4", python = ">=3.11,<3.13" }
kittentts = "^0.1.3"
soundfile = "^0.12.1"
mcp = { version = "^1.12.2", extras = ["fastmcp"] }
langextract = "^1.0.2"
transformers = "^5.5.0"
huggingface-hub = "^1.5.0"
openai-harmony = "0.0.3"
icalendar = "^5.0.11"
python-dateutil = "^2.9.0"
pywebpush = "^1.14.0"
python-json-logger = { version = "^2.0.7", optional = true }
opentelemetry-exporter-otlp = { version = "^1.39.1", optional = true }
opentelemetry-instrumentation-fastapi = { version = "^0.60b1", optional = true }
opentelemetry-instrumentation-requests = { version = "^0.60b1", optional = true }
opentelemetry-instrumentation-logging = { version = "^0.60b1", optional = true }
prometheus-client = { version = "^0.20.0", optional = true }
flower = { version = "^2.0.1", optional = true }
scikit-learn = "^1.5.0"
Pillow = "^10.4.0"
hf-transfer = "^0.1.9"
hf-xet = "^1.4.2"
chromadb = "^1.1.0"
accelerate = "^1.10.1"
playwright = "^1.58.0"
pywinauto = "^0.6.9"
open-clip-torch = { version = "3.2.0", markers = "python_version < \"3.15\"" }
# Keep this pair aligned. GPU installs may replace the wheel source, not the versions.
torch = { version = "2.10.0", markers = "python_version < \"3.15\"" }
torchvision = { version = "0.25.0", markers = "python_version < \"3.15\"" }
openai = "^2.44.0"
tinker = "^0.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pre-commit = "^4.2.0"
ipykernel = "^6.30.1"

[tool.poetry.extras]
# Optional worker monitoring dashboard; Celery and the Redis client are base.
workers = ["flower"]
telemetry = [
    "python-json-logger",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-logging",
    "prometheus-client",
]
postgres = ["sqlalchemy", "psycopg2-binary", "alembic"]
legacy-security = ["bcrypt", "pyopenssl"]
weaviate = ["weaviate-client"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
float = "main:main"

[tool.isort]
profile = "black"
