[pytest]
addopts = -vv
testpaths =
    backend/app/tests
    backend/app/services/tests
    backend/services/tests
norecursedirs = notebooks/evaluations
markers =
    api: tests that perform live API calls
    autonomy: opt-in autonomy/background orchestration tests
    integration: integration tests skipped by default unless explicitly enabled
    local: tests that run against a local LLM

