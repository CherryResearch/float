name: CI

on:
  push:
    branches: [ test ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run secret scan
        run: poetry run pre-commit run gitleaks --all-files
      - name: Run pre-commit
        run: SKIP=gitleaks poetry run pre-commit run --all-files
      - name: Run tests
        run: poetry run pytest -vv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run frontend:lint
      - name: Run tests
        run: npm run frontend:test
      - name: Build frontend
        run: npm run frontend:build
